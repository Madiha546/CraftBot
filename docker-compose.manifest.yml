services:
  craftbot-instance:
    image: craftbot:latest
    env_file:
      - .env
    environment:
      - OMNIPARSER_BASE_URL=http://localhost:7861
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge